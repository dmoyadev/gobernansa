# Every push to main deploys the rules, the indexes and both sites; every PR from this repository, a preview of both sites.
# One file for both, so the build, its variables and the checks can't drift apart
name: Firebase Hosting
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_deploy:
    # A PR from a fork gets no secrets
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      LIVE: ${{ github.event_name == 'push' }}
      VITE_ENV_NAME: ${{ secrets.VITE_ENV_NAME }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      # Without a bucket the apps hide the photo and video pickers: put it back once the project is on Blaze (docs/v1.md, B1)
      # VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_MAIL_MODE: ${{ secrets.VITE_MAIL_MODE }}
      VITE_APP_CHECK_KEY: ${{ secrets.VITE_APP_CHECK_KEY }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # For npm run check:rules: Java runs the Firestore emulator, and its jar is downloaded once
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      # The version each build shows and reports its errors with, sortable: build date and time (UTC) and commit. A PR's
      # checkout is GitHub's merge commit, so its own head goes instead
      - run: echo "VITE_RELEASE=$(date -u +%Y.%m.%d-%H%M)-$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"
      # ROB-7: a known high or critical vulnerability in what ships stops the run
      - run: npm ci && npm audit --omit=dev --audit-level=high && npx eslint . && npm run check:rules && npm run build
      # MON-10: the code maps stay with the run, named after the release, for npm run symbolicate; never published
      - uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ env.VITE_RELEASE }}
          path: apps/*/dist/**/*.map
          retention-days: ${{ env.LIVE == 'true' && 90 || 14 }}
      - run: find apps/*/dist -name '*.map' -delete
      # Rules and indexes go first so the new app finds what it needs, and either failing stops both sites. An index only in
      # the console is left alone: without a terminal, the CLI never deletes one
      - if: ${{ env.LIVE == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DMOYADEV_GOBERNANSA }}
      - if: ${{ env.LIVE == 'true' }}
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project dmoyadev-gobernansa --non-interactive
      # Live on main; on a PR, an empty channel makes a preview channel of its own
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DMOYADEV_GOBERNANSA }}
          channelId: ${{ env.LIVE == 'true' && 'live' || '' }}
          projectId: dmoyadev-gobernansa
          target: webapp
      # The admin goes last and on its own, so a failure there (e.g. its Hosting site missing) leaves the webapp deployed
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DMOYADEV_GOBERNANSA }}
          channelId: ${{ env.LIVE == 'true' && 'live' || '' }}
          projectId: dmoyadev-gobernansa
          target: admin
      # MON-5: both sites answer with their page and its first script, or the run fails and GitHub emails it. The script's
      # type is checked too: a missing file would get index.html from the rewrite, with a 200
      - name: Check both sites
        if: ${{ env.LIVE == 'true' }}
        run: |
          for site in https://dmoyadev-gobernansa.web.app https://gobernansa-admin.web.app; do
            script=$(curl -fsS --retry 3 --retry-all-errors "$site/" | grep -oE '<script[^>]+src="/[^"]+\.js"' | head -1 | sed -E 's/.*src="([^"]+)".*/\1/')
            if [ -z "$script" ]; then
              echo "::error::$site doesn't load any script"
              exit 1
            fi
            type=$(curl -fsS --retry 3 --retry-all-errors -o /dev/null -w '%{content_type}' "$site$script")
            if [[ "$type" != *javascript* ]]; then
              echo "::error::$site$script answers with $type"
              exit 1
            fi
            echo "$site loads $script"
          done

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    env:
      VITE_ENV_NAME: ${{ secrets.VITE_ENV_NAME }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
      VITE_MAIL_MODE: ${{ secrets.VITE_MAIL_MODE }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The version each build shows and reports its errors with, sortable: build date and time (UTC) and commit
      - run: echo "VITE_RELEASE=$(date -u +%Y.%m.%d-%H%M)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - run: npm ci && npx eslint . && npm run build
      # MON-10: the code maps stay with the run, named after the release, for npm run symbolicate; never published
      - uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ env.VITE_RELEASE }}
          path: apps/*/dist/**/*.map
          retention-days: 90
      - run: find apps/*/dist -name '*.map' -delete
      # Rules go first so the new app finds the rules it needs, and a rules file that doesn't compile stops both
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DMOYADEV_GOBERNANSA }}
      - run: npx firebase deploy --only firestore:rules --project dmoyadev-gobernansa --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DMOYADEV_GOBERNANSA }}
          channelId: live
          projectId: dmoyadev-gobernansa
          target: webapp
      # The admin goes last and on its own, so a failure there (e.g. its Hosting site missing) leaves the webapp deployed
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DMOYADEV_GOBERNANSA }}
          channelId: live
          projectId: dmoyadev-gobernansa
          target: admin
      # MON-5: both sites answer with their page and its first script, or the run fails and GitHub emails it. The script's
      # type is checked too: a missing file would get index.html from the rewrite, with a 200
      - name: Check both sites
        run: |
          for site in https://dmoyadev-gobernansa.web.app https://gobernansa-admin.web.app; do
            script=$(curl -fsS --retry 3 --retry-all-errors "$site/" | grep -oE '<script[^>]+src="/[^"]+\.js"' | head -1 | sed -E 's/.*src="([^"]+)".*/\1/')
            if [ -z "$script" ]; then
              echo "::error::$site doesn't load any script"
              exit 1
            fi
            type=$(curl -fsS --retry 3 --retry-all-errors -o /dev/null -w '%{content_type}' "$site$script")
            if [[ "$type" != *javascript* ]]; then
              echo "::error::$site$script answers with $type"
              exit 1
            fi
            echo "$site loads $script"
          done

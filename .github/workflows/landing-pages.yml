name: Deploy the landing to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - apps/landing/**
      - packages/shared/theme/**
      - package-lock.json
      - .github/workflows/landing-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Vite joins the section files and takes the colours from packages/shared/theme; only dist goes up
      - run: npm ci && npm run build -w apps/landing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist
      - id: deployment
        uses: actions/deploy-pages@v4
